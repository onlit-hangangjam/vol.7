<style id="tt-layout">
.demo{display:none!important}
body:not(.hgj-editor) #ed-fab,body:not(.hgj-editor) #ed{display:none!important}
/* 시간표: 시간 칸 · 타임라인 칸 · 카드를 분리해 격치지 않게 */
.tt::before{display:none}
.tt li{grid-template-columns:52px 24px minmax(0,1fr);gap:0 6px;padding:0}
.tt .when{text-align:right;padding-top:15px;line-height:1.2}
.tt .when time{display:block;padding:0;font-size:14px}
.tt .when small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.tt .rail{position:relative}
.tt .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:repeating-linear-gradient(var(--muted) 0 8px,transparent 8px 14px)}
.tt li:first-child .rail::before{top:22px}
.tt li:last-child .rail::before{bottom:auto;height:22px}
.tt .rail::after{content:"";position:absolute;left:50%;top:15px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--bg);border:3px solid var(--ink)}
.tt .card{margin:6px 0}
.tt .card::before{display:none}
.tt li.live .rail::after{background:var(--red);border-color:var(--red)}
.tt-foot{margin:12px 0 0;font-size:12px;color:var(--muted)}
.tt-note{margin:0 0 12px;display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600}
.pg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pg-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pg-hit{display:block;color:inherit;text-decoration:none;flex:1}
a.pg-hit:active{opacity:.8}
.pg-img{position:relative;aspect-ratio:4/3;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pg-img img{width:100%;height:100%;object-fit:cover;display:block}
.pg-img.empty .pl-ico{transform:scale(1.35)}
.pg-img.empty .pl-dia{transform:rotate(45deg) scale(1.1)}
.pg-img.empty .sign{transform:scale(1.5)}
.pg-img.empty .sign.dia{transform:rotate(45deg) scale(1.2)}
.pg-where{position:absolute;left:8px;top:8px;background:rgba(31,32,36,.82);color:#fff;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.pg-body{padding:10px 12px 12px}
.pg-title{display:block;font-size:14.5px;font-weight:800;line-height:1.3;word-break:keep-all}
.pg-desc{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.5;word-break:keep-all}
.pg-more{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;color:var(--blue)}
.pg-edit{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.lu-grid.n3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lu-grid.n3 .lu-card{padding:8px}
.lu-grid.n3 .lu-name{font-size:13px}
.lu-grid.n3 .lu-role{font-size:10.5px}
.lu-grid.n3 .lu-photo span{font-size:18px}
.lu-card.wide{grid-column:1/-1;flex-direction:row;align-items:center;text-align:left;gap:14px;flex-wrap:wrap}
.lu-card.wide .lu-photo{width:42%;margin-bottom:0;flex:none}
.lu-card.wide .lu-info{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.lu-card.wide .lu-name{font-size:18px}
.lu-card.wide .lu-edit{flex-basis:100%}
.lu-info{display:flex;flex-direction:column;align-items:inherit}
.pl-group{margin-bottom:18px}
.pl-card{margin-bottom:10px}
.pl-hit{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:14px 16px;color:inherit;text-decoration:none;align-items:start}
a.pl-hit:active{opacity:.8}
.pl-ico{width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:#fff}
.pl-ico svg{width:26px;height:26px}
.pl-circ{background:var(--blue);border-radius:50%}
.pl-circ2{background:var(--green,#21A35B);border-radius:50%}
.pl-oct{background:var(--red);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.pl-dia{background:var(--yellow);color:#1F2024;border-radius:8px;transform:rotate(45deg) scale(.8)}

.pl-sq{background:var(--asphalt);border-radius:12px}
.pl-tri{background:var(--orange,#F08A24);clip-path:polygon(50% 3%,100% 95%,0 95%)}

.pl-where{display:inline-block;font-size:11px;font-weight:700;color:var(--blue);margin-bottom:2px}
.pl-title{display:block;font-size:15.5px;font-weight:800;line-height:1.3}
.pl-desc{font-size:13px;color:var(--muted);margin:4px 0 0;line-height:1.55;word-break:keep-all}
.pl-card .pg-edit{padding:0 16px 14px}
.lu-note{font-size:13px;font-weight:600;color:var(--ink);margin:-2px 0 10px;word-break:keep-all}
.lu-note-edit{margin:0 0 10px}
.hgj-ver{font-size:11px;color:var(--muted);text-align:center;margin:10px 0 0;opacity:.7}
.lu-group{margin-bottom:18px}
.lu-h{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--muted);margin:0 0 8px}
.lu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lu-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.lu-photo{width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--yellow);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.lu-photo img{width:100%;height:100%;object-fit:cover;display:block}
.lu-photo span{font-weight:800;font-size:26px;color:#1F2024}
.lu-name{font-size:15px;font-weight:800;line-height:1.25;word-break:keep-all}
.lu-role{font-size:12px;color:var(--muted);margin-top:2px}
.lu-ig{font-size:12px;font-weight:700;color:var(--blue);margin-top:6px;text-decoration:none;word-break:break-all}
.lu-ig.none{color:var(--muted);font-weight:500}
.lu-edit{width:100%;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.lu-btn{display:inline-block;font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:5px 10px;cursor:pointer}
.lu-igrow{display:flex;gap:6px}
.lu-in{flex:1;min-width:0;font:inherit;font-size:12px;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.lu-msg{font-style:normal;font-size:11px;color:var(--red)}
:root{--sponsor:#F08A24;--green:#21A35B;--orange:#F08A24}
.m-sponsor{fill:var(--sponsor)}
#mapsvg .m-redfill,#mapsvg .m-bluefill{fill:var(--green)}
#mapsvg .m-stage{fill:var(--orange)}
#mapsvg .m-ring{stroke:var(--orange)}

.login select:focus{border-color:var(--blue);outline:none}
#in-genre-etc{margin-top:8px}
.mc{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.mc-top{background:var(--yellow);color:#1F2024;padding:18px 18px 16px}
.mc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:1.5px solid #1F2024}
.mc-title{font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.mc-sub{font-weight:700;font-size:11px;letter-spacing:.04em;margin-top:4px}

.mc-body{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center;padding:14px 0;border-bottom:1.5px solid #1F2024}
.mc-ava{width:92px;height:92px;border-radius:16px;overflow:hidden;background:#FFF8E6}
.mc-ava svg{display:block;width:100%;height:100%}
.mc-ava{display:flex;align-items:center;justify-content:center}
.mc-ava img{width:100%;height:100%;object-fit:contain;padding:10px;box-sizing:border-box}
.mc-body dl{margin:0}
.mc-body dt{font-size:10.5px;font-weight:700;letter-spacing:.04em;opacity:.65;margin-top:6px}
.mc-body dt:first-child{margin-top:0}
.mc-body dd{margin:1px 0 0;font-weight:800;font-size:16px;line-height:1.25;word-break:keep-all}
.mc-foot{display:flex;justify-content:space-between;align-items:flex-end;padding-top:12px}
.mc-foot span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;opacity:.65}
.mc-foot b{font-size:30px;font-weight:800;line-height:1.1}
.mc-foot div:first-child{font-weight:800;font-size:14px}
.mc-foot .r{text-align:right}
.mc-foot .r b{font-size:17px}
.mc-hist{padding:14px 18px 16px}
.mc-hh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.mc-hh b{font-size:13px;font-weight:800}
.mc-hh span{font-size:12px;color:var(--muted)}
.mc-dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mc-dot{text-align:center}
.mc-dot span{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1.15;border-radius:999px;background:var(--line);font-size:12px;color:var(--muted);filter:grayscale(1)}
.mc-dot.got span{background:var(--blue);color:#fff;filter:none;font-weight:800}
.mc-dot.old span{background:#9DBBF7;color:#fff;filter:none;font-weight:800}
.mc-dot em{display:block;font-style:normal;font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap}
.mc-hnote{font-size:11px;color:var(--muted);margin:10px 0 0}
.mc-status{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.mc-k{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.mc-status h3{font-size:19px;margin:4px 0 2px}
.mc-d{font-size:13px;color:var(--muted);margin:0 0 14px}
.mc-lvrow{display:flex;justify-content:space-between;font-size:13px}
.mc-lvname{color:var(--blue)}
.mc-bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:10px}
.mc-bar span{display:block;height:100%;background:var(--blue);border-radius:999px}
.mc-cap{font-size:12px;color:var(--muted);margin:8px 0 0}
.mc-cap.legend{color:var(--ink);font-weight:600}
.mc-rule{font-size:11px;color:var(--muted);margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.mc-h2{font-size:18px}
.mc-level{display:inline-flex;align-items:center;gap:6px}
.mc-level svg{width:17px;height:17px}
.mc-ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.mc-step{text-align:center;padding:10px 4px;border-radius:14px;border:2px solid transparent;opacity:.45}
.mc-step.done{opacity:1}
.mc-step.cur{opacity:1;border-color:var(--ink);background:var(--bg)}
.mc-lvrow{align-items:baseline;gap:10px}
.mc-lvname{white-space:nowrap}
.mc-lvdesc{margin:2px 0 0;font-size:12.5px;color:var(--muted);text-align:right;word-break:keep-all}
.mc-prog{margin-top:14px}
.mc-pl{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800}
.mc-pl span{display:inline-flex;align-items:center;gap:5px}
.mc-pl.sub{font-weight:600;font-size:11px;color:var(--muted);margin-top:6px}
.mc-mini{display:inline-flex;width:20px;height:20px;border-radius:6px;align-items:center;justify-content:center}
.mc-mini svg{width:13px;height:13px}

.t-regular .mc-mini{background:#E6EFFF;color:#1764F0}
.t-core .mc-mini{background:#FFF2C4;color:#E08A1E}
.t-legend .mc-mini{background:#1F2024;color:#FFC700}
.mc-prog .mc-bar{margin-top:8px}
.mc-ico{width:42px;height:42px;margin:0 auto 6px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.mc-ico svg{width:22px;height:22px}
.t-starter .mc-ico{background:#ECECEA;color:#55554F}
.t-regular .mc-ico{background:#E6EFFF;color:#1764F0}
.t-core .mc-ico{background:#FFF2C4;color:#E08A1E}
.t-legend .mc-ico{background:#1F2024;color:#FFC700}
.mc-step b{display:block;font-size:11px;font-weight:800}
.mc-step span{display:block;font-size:10.5px;color:var(--muted)}
#genre-panel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.gp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.gp-head b{font-size:15px;font-weight:800}
.gp-head span{font-size:12px;color:var(--muted)}
.gp-row{display:grid;grid-template-columns:76px 1fr 38px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.gp-n em{font-style:normal;font-size:9px;font-weight:800;background:var(--red);color:#fff;border-radius:4px;padding:1px 4px;vertical-align:1px}

.gp-note{font-size:11px;color:var(--muted);margin:8px 0 0}
.tt li.k-draw .when time:empty::before{content:"";}
</style>

<!--
  화면 뼈대입니다. data-k="경로" 가 붙은 글자는 config.js 값으로 채워지고,
  id 가 붙은 빈 상자(#home, #tt 등)는 app.js 가 config.js 목록으로 그립니다.
-->
<div class="demo" data-k="texts.demo"></div>
<div class="app">
  <header class="top">
    <div class="brand"><span data-k="event.brand"></span> <small data-k="event.brandSub"></small></div>
    <span class="pill dlabel">D-31</span>
  </header>

  <!-- HOME: 블록 순서는 config.js layout.home -->
  <section class="view on" id="v-home" aria-label="홈"><div id="home" class="stack"></div></section>

  <!-- TIMETABLE -->
  <section class="view" id="v-time" aria-label="시간표">
    <h2 data-k="texts.titleTime"></h2>
    <div class="legend" id="legend"></div>
    <p class="note tt-note" data-k="texts.timetableNote"></p>
    <ul class="tt" id="tt"></ul>
    <p class="note tt-foot" data-k="texts.timetableFoot"></p>
  </section>

  <!-- FUN: 탭 구성은 config.js layout.fun -->
  <section class="view" id="v-fun" aria-label="즐길거리">
    <h2 data-k="texts.titleFun"></h2>
    <div class="seg" role="tablist" id="seg"></div>
    <div id="s-prog"></div>
    <div id="s-line" hidden></div>
    <div id="s-music" hidden></div>
  </section>

  <!-- MAP: 지도 그림은 아래 SVG를 직접 고치세요. 구역 설명은 config.js content.zones -->

    <div class="mapwrap">
      <img class="mapimg" id="mapimg" alt="행사장 지도" hidden>
      <svg id="mapsvg" viewBox="0 0 360 300" role="img" aria-label="행사장 배치 개념도">

        <text x="97" y="64" text-anchor="middle" font-size="11" font-weight="800" class="m-white">① 장르 체험</text>
        <rect x="198" y="48" width="130" height="24" rx="6" class="m-bluefill"/>
        <text x="263" y="64" text-anchor="middle" font-size="11" font-weight="800" class="m-white">② 플리마켓</text>
        <circle cx="180" cy="168" r="66" class="m-ring"/>
        <circle cx="180" cy="168" r="44" class="m-stage"/>
        <text x="180" y="164" text-anchor="middle" font-size="12" font-weight="800" class="m-ink">③ 메인 무대</text>
        <text x="180" y="180" text-anchor="middle" font-size="10" class="m-ink">JAM · 공연 · 배틀</text>
        <text x="180" y="248" text-anchor="middle" font-size="10" font-weight="800" class="m-text">④ DANCE ZONE</text>
        <rect x="282" y="140" width="62" height="40" rx="8" class="m-info"/>
        <text x="313" y="157" text-anchor="middle" font-size="10" font-weight="800" class="m-yellow">⑤ 인포</text>
        <text x="313" y="171" text-anchor="middle" font-size="9" class="m-white">기프트 수령</text>
        <rect x="24" y="140" width="62" height="40" rx="8" class="m-booth"/>

        <rect x="266" y="88" width="80" height="42" rx="8" class="m-sponsor"/>

  function pictoFor(m) {
    var g = (m.genres && m.genres[0]) || m.genre || "";
    var key = /^(보깅|코레오|현대무용|재즈)/.test(g) || /vogu|choreo|contemporary|jazz/i.test(g) ? "왁킹" : g;

  }
  function show(m) {
    var total = m.vols.length, recent = m.vols.filter(inWindow).length || 1;
    var lv = level(recent), nx = nextLevel(lv);
    var gs = m.genres || (m.genre ? [m.genre] : []);
    var style = gs.length ? gs.map(function (g) { return STYLE_EN[g] || String(g).toUpperCase(); }).join(" · ") : "—";
    var ladder = '<div class="mc-ladder">' + LEVELS.map(function (l) {
      var st = l === lv ? "cur" : (recent >= l.min ? "done" : "");
      return '<div class="mc-step ' + st + " t-" + l.name.toLowerCase() + '"><div class="mc-ico">' + icon(l.name) + '</div><b>' + l.name + "</b><span>" + range(l) + "</span></div>";
    }).join("") + "</div>";
    var dots = volKeys.map(function (v) {
      var got = m.vols.indexOf(v) > -1, old = got && !inWindow(v);
      return '<div class="mc-dot ' + (got ? (old ? "old" : "got") : "") + '"><span>' + (got ? "✓" : "🔒") + '</span><em>VOL.' + v + "</em></div>";
    }).join("");
    var anyOld = m.vols.some(function (v) { return !inWindow(v); });
    var status = nx
      ? '<div class="mc-prog"><div class="mc-pl"><span class="t-' + lv.name.toLowerCase() + '"><i class="mc-mini">' + icon(lv.name) + '</i>' + lv.name + '</span><span class="t-' + nx.name.toLowerCase() + '">' + nx.name + '<i class="mc-mini">' + icon(nx.name) + '</i></span></div>' +
        '<div class="mc-bar"><span style="width:' + Math.round(((recent - lv.min + 1) / (nx.min - lv.min + 1)) * 100) + '%"></span></div>' +
        '<div class="mc-pl sub"><span>지금 ' + recent + '회</span><span>' + nx.min + '회부터</span></div></div>' +
        '<p class="mc-cap">' + (nx.min - recent) + "번 더 함께하면 " + nx.name + "로 올라가요</p>"
      : '<p class="mc-cap legend">한강잼의 역사를 함께해 주셔서 고마워요. 다음 한강잼에서도 만나요!</p>';
    var ws = winStart.replace(/-/g, ".");
    $("#me-card").innerHTML =
      '<div class="mc lv-' + lv.name.toLowerCase() + '">' +
        '<div class="mc-top">' +
          '<div class="mc-head"><div><div class="mc-title">HAN GANG JAM</div><div class="mc-sub">OFFICIAL MEMBERSHIP</div></div><span class="mc-level">' + icon(lv.name) + lv.name + "</span></div>" +
          '<div class="mc-body"><div class="mc-ava">' + pictoFor(m) + '</div><dl>' +
            "<dt>MEMBER NAME</dt><dd>" + esc(m.name) + "</dd><dt>MAIN STYLE</dt><dd>" + esc(style) + "</dd><dt>MEMBER SINCE</dt><dd>" + esc(m.since) + "</dd></dl></div>" +
          '<div class="mc-foot"><div><span>TOTAL PARTICIPATION</span><b>' + ("0" + total).slice(-2) + '</b> TIMES</div><div class="r"><span>MEMBER ID</span><b>' + esc(m.id) + "</b></div></div>" +
        "</div>" +
        '<div class="mc-hist"><div class="mc-hh"><b>MY HAN GANG JAM HISTORY</b><span>' + DB.vols[volKeys[0]].slice(0, 4) + " — " + lastDate.slice(0, 4) + '</span></div><div class="mc-dots">' + dots + "</div>" +
          (anyOld ? '<p class="mc-hnote">옅은 색 회차는 최근 3년 이전이라 등급 집계에서 빠져요.</p>' : "") + "</div>" +
      "</div>" +
      '<div class="mc-status"><div class="mc-k">YOUR MEMBERSHIP STATUS</div><h3>한강잼과 함께한 ' + total + "번째 순간!</h3>" +

  function genresPanel(mine) {

    var max = list.length ? list[0][1] : 1, mm = (mine || []).map(norm);

      db.collection("programs").onSnapshot(function (snap) { snap.docs.forEach(function (doc) { if (doc.exists) META[doc.id] = doc.data(); }); render(); }, function () {});
    });
    Promise.all([claude.use("user"), claude.use("assets")]).then(function (r) {
      if (!r[0] || !r[1]) return; assets = r[1];
      return r[0].canEdit().then(function (ok) { editable = !!ok; render(); });
    });
  }
})();
</script>
